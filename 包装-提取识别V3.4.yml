    - data:
        code: "import json\nimport re\n\n# 不按某张图纸的固定坐标裁切。位置判断交给视觉模型，代码只排除明显的长文本和编号。\n\
          SHORT_NUMBER = re.compile(r'^\\s*[+\\-–—]*\\s*(?:[RrØΦφ]\\s*)?\\d+(?:\\\
          .\\d+)?'r'(?:\\s*[xX×*]\\s*\\d+(?:\\.\\d+)?){0,2}'r'(?:\\s*(?:±\\s*\\d+(?:\\\
          .\\d+)?|\\+\\s*\\d+(?:\\.\\d+)?\\s*/\\s*-\\s*\\d+(?:\\.\\d+)?))?'r'(?:\\\
          s*(?:mm|cm|°))?\\s*[\\-–—]*\\s*$', re.I)\n\ndef load(value):\n    if isinstance(value,\
          \ list):\n        return value\n    if isinstance(value, dict):\n      \
          \  return value.get('rows', value.get('items', []))\n    try:\n        parsed\
          \ = json.loads(str(value or ''))\n        return parsed if isinstance(parsed,\
          \ list) else parsed.get('rows', parsed.get('items', []))\n    except Exception:\n\
          \        return []\n\ndef main(ocr_lines: str) -> dict:\n    candidates\
          \ = []\n    for row in load(ocr_lines):\n        if not isinstance(row,\
          \ dict):\n            continue\n        text = re.sub(r'\\s+', ' ', str(row.get('text',\
          \ '')).strip())\n        box = row.get('box')\n        if not SHORT_NUMBER.fullmatch(text)\
          \ or not isinstance(box, list) or len(box) != 4:\n            continue\n\
          \        candidates.append({'i': row.get('i'), 'text': text, 'box': box,\n\
          \                           'score': round(float(row.get('score') or 0),\
          \ 4)})\n    candidates.sort(key=lambda item: (float(item['box'][1]), float(item['box'][0])))\n\
          \    return {'dimension_candidates': json.dumps(candidates, ensure_ascii=False,\
          \ separators=(',', ':'))}\n"
        code_language: python3
