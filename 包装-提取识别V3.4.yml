    - data:
        code: "import json\n\ndef main(ocr_json) -> dict:\n    data = ocr_json[0]\
          \ if isinstance(ocr_json, list) and ocr_json else ocr_json\n    pages =\
          \ (data or {}).get('pages', [])\n    result = pages[0].get('pruned_result',\
          \ {}) if pages else {}\n    texts = result.get('rec_texts', [])\n    scores\
          \ = result.get('rec_scores', [])\n    boxes = result.get('rec_boxes', [])\n\
          \    rows, llm_rows, source_texts = [], [], []\n    for i, value in enumerate(texts):\n\
          \        text = str(value).strip()\n        if not text:\n            continue\n\
          \        score = round(float(scores[i]), 4) if i < len(scores) else 0\n\
          \        box = boxes[i] if i < len(boxes) else None\n        rows.append({'i':\
          \ i, 'text': text, 'score': score, 'box': box})\n        llm_rows.append({'i':\
          \ i, 't': text, 'b': box})\n        if score >= 0.45:\n            source_texts.append(text)\n\
          \n    full = ' | '.join(source_texts)\n    upper = full.upper()\n    features\
          \ = []\n    feature_rules = [\n        (['CORRUGATED', '瓦楞'], '瓦楞纸板 corrugated\
          \ fiberboard'),\n        (['E FLUTE', 'E楞'], 'E楞 E flute 单瓦楞'),\n      \
          \  (['B FLUTE', 'B楞'], 'B楞 B flute'),\n        (['KRAFT', '牛皮纸'], '牛皮纸 kraft\
          \ paper'),\n        (['BURSTING', '耐破'], '耐破强度 bursting strength'),\n  \
          \      (['COMPRESSION', '抗压'], '抗压强度 compression strength'),\n        (['INNER',\
          \ 'OUTER', '内尺寸', '外尺寸'], '纸盒内外尺寸 公差'),\n        (['FSC', 'RECYCLE', '回收'],\
          \ 'FSC 回收标志 包装与环境标识'),\n        (['HANDLE', 'FRAGILE', 'KEEP DRY', '储运'],\
          \ '运输包装收发货及储运图示标志'),\n        (['ACCESSORY BOX', 'CARTON', '纸盒', '纸箱'],\
          \ '附件盒 折叠纸盒 运输包装适用条件'),\n        (['FOLD', 'DIE CUT', '模切', '压痕'], '模切折叠盒\
          \ 结构型式'),\n        (['LENOVO', 'LCFC'], '联想企业通用包装标准')\n    ]\n    for keys,\
          \ label in feature_rules:\n        if any(key.upper() in upper for key in\
          \ keys):\n            features.append(label)\n    query = '；'.join(features)\
          \ or '包装图纸适用的材料、性能、运输、标识和结构标准'\n    query += '。分别返回适用范围、触发特征、排除条件、标准ID和卡片信息。'\n\
          \    return {\n        'ocr_lines': json.dumps(rows, ensure_ascii=False,\
          \ separators=(',', ':')),\n        'llm_ocr_lines': json.dumps(llm_rows,\
          \ ensure_ascii=False, separators=(',', ':')),\n        'retrieval_query':\
          \ query[:1200]\n    }\n"
