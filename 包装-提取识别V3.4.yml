    - data:
        code: "import json\nimport re\n\nNAMES = {'corrugated':'瓦楞','molded_pulp':'纸浆模','tracing_paper':'硫酸纸','bamboo_fiber':'竹纤维','unknown':'未知'}\n\
          LABEL = re.compile(r'^(?:MATERIAL|材质|材料)\\s*[:：]?\\s*$', re.I)\nINLINE =\
          \ re.compile(r'^(?:MATERIAL|材质|材料)\\s*[:：]\\s*(.+)$', re.I)\nNEXT_LABEL\
          \ = re.compile(r'^(?:PART\\s*NO\\.?|BURSTING|COMPRESSION|THICKNESS|DENSITY|SIZE|GROSS\\\
          s*WEIGHT|MOISTURE|COLOR|PRINTING|REMARK|料号|尺寸|厚度|密度|毛重|颜色)\\b', re.I)\n\
          COMPOSITE = re.compile(r'MATT?\\s*FILM|LASER\\s*FILM|\\bCCNB\\b|\\bC1S\\\
          b|(?:\\d+\\s*G\\s*)?GB\\b', re.I)\nPATTERNS = {\n    'molded_pulp': re.compile(r'纸浆模|纸浆模塑|模塑纸浆|\\\
          b(?:molded|moulded|paper|straw|recycled?\\s+corrugated)\\s+pulp\\b|\\bpulp\\\
          s+mold(?:ed)?\\b', re.I),\n    'tracing_paper': re.compile(r'硫酸纸|\\btracing\\\
          s+paper\\b', re.I),\n    'bamboo_fiber': re.compile(r'竹纤维|\\bbamboo\\s+fib(?:er|re)\\\
          b', re.I),\n    'corrugated': re.compile(r'瓦楞纸(?:板)?|\\bcorrugated\\s+(?:fiber\\\
          s*)?board\\b|\\b[ABCEFG]\\s*[- ]?flute\\b', re.I),\n}\n\ndef load_rows(value):\n\
          \    try:\n        parsed = json.loads(value) if isinstance(value, str)\
          \ else value\n        if isinstance(parsed, dict): parsed = parsed.get('rows',\
          \ parsed.get('items', []))\n        return [r for r in parsed if isinstance(r,\
          \ dict)] if isinstance(parsed, list) else []\n    except Exception:\n  \
          \      return []\n\ndef box(row):\n    b = row.get('box')\n    try:\n  \
          \      if not isinstance(b, (list, tuple)) or len(b) != 4: return None\n\
          \        x1,y1,x2,y2 = [float(x) for x in b]\n        return (x1,y1,x2,y2)\
          \ if x2 > x1 and y2 > y1 else None\n    except (TypeError, ValueError):\n\
          \        return None\n\ndef material_candidates(rows):\n    found = []\n\
          \    for label in rows:\n        raw = str(label.get('text', '')).strip()\n\
          \        inline = INLINE.match(raw)\n        if not LABEL.fullmatch(raw)\
          \ and not inline: continue\n        pieces = []\n        if inline:\n  \
          \          pieces.append(label)\n        lb = box(label)\n        if lb:\n\
          \            h = lb[3] - lb[1]\n            for row in rows:\n         \
          \       if row is label: continue\n                rb = box(row)\n     \
          \           if not rb or rb[0] < lb[2] - h * 0.4: continue\n           \
          \     dy = (rb[1]+rb[3]-lb[1]-lb[3])/2\n                if -max(h, rb[3]-rb[1])\
          \ <= dy <= max(h*2.5, rb[3]-rb[1]*2.5):\n                    if not NEXT_LABEL.match(str(row.get('text','')).strip()):\
          \ pieces.append(row)\n        # OCR may return the entire material cell\
          \ as one row. Keep only text\n        # spatially associated with the MATERIAL\
          \ label; never search the page.\n        pieces = sorted({str(r.get('i')):r\
          \ for r in pieces}.values(), key=lambda r: ((box(r) or (0,0,0,0))[1], (box(r)\
          \ or (0,0,0,0))[0]))\n        values = [r for r in pieces if (r is not label\
          \ or inline) and\n                  (any(pattern.search(str(r.get('text','')))\
          \ for pattern in PATTERNS.values()) or COMPOSITE.search(str(r.get('text',''))))]\n\
          \        if values:\n            found.append({'labelIndex':label.get('i'),\
          \ 'text':' '.join(str(r.get('text','')).strip() for r in values),\n    \
          \                      'lineIndexes':[r.get('i') for r in values if r.get('i')\
          \ is not None]})\n    if not found:\n        # Some CAD PDFs outline the\
          \ MATERIAL label as paths while leaving the\n        # material value as\
          \ text. Use only strong material expressions, never\n        # weak words\
          \ such as KRAFT, PAPER or a product name.\n        strong = [r for r in\
          \ rows if any(pattern.search(str(r.get('text',''))) for pattern in PATTERNS.values())\
          \ or\n                  COMPOSITE.search(str(r.get('text','')))]\n     \
          \   if strong:\n            found.append({'labelIndex':None,'text':' '.join(str(r.get('text','')).strip()\
          \ for r in strong),\n                          'lineIndexes':[r.get('i')\
          \ for r in strong if r.get('i') is not None]})\n    return found\n\ndef\
          \ classify(text):\n    kinds = [name for name, pattern in PATTERNS.items()\
          \ if pattern.search(text)]\n    if COMPOSITE.search(text): return None,\
          \ '复合材质需要确认主体类别'\n    # \"recycled corrugated pulp\" describes pulp feedstock,\
          \ not board.\n    if 'molded_pulp' in kinds and 'corrugated' in kinds and\
          \ not re.search(r'\\bcorrugated\\s+(?:fiber\\s*)?board\\b|\\b[ABCEFG]\\\
          s*[- ]?flute\\b', text, re.I):\n        kinds.remove('corrugated')\n   \
          \ if len(kinds) == 1: return kinds[0], ''\n    return None, '材料表述冲突' if\
          \ kinds else '材料写法未被明确规则覆盖'\n\nSTRUCTURE_ENUM = [{'code': 'flat_box', 'name':\
          \ '平口箱', 'primaryEvidence': '连续箱面、接合边、顶底摇盖构成可展平的箱体', 'textCorroboration':\
          \ 'GLUE、箱体名称仅作佐证，不单独决定类别', 'boundary': '不把预粘合盒或套盒强归入平口箱；具体 FEFCO 型号不在此处判定'},\
          \ {'code': 'folding_box', 'name': '折叠盒', 'primaryEvidence': '一张展开料形成盒底、侧墙／围墙和盒盖，折叠成盒',\
          \ 'textCorroboration': 'ACC BOX、CARTON、FOLD 仅作佐证', 'boundary': '不默认属于 0427；锁合件只在图纸确有标注时识别'},\
          \ {'code': 'corrugated_pad', 'name': '非箱型瓦楞纸垫', 'primaryEvidence': '瓦楞板形成带折叠段或开孔的垫件，不构成完整闭合盒体',\
          \ 'textCorroboration': 'PAPER PAD 名称仅作佐证', 'boundary': '不使用盒底、围墙和盒盖的成品盒名称'}]\n\
          STRUCTURE_CLUE = re.compile(r'\\b(?:ACC\\s*BOX|CARTON|PAPER\\s*PAD|FOLD(?:ING)?|GLUE|LID|FLAP|LOCK|SLOT)\\\
          b|折叠盒|平口箱|纸垫|盒盖|摇盖|插舌|粘合|胶合|压痕', re.I)\n\ndef main(ocr_lines: str) -> dict:\n\
          \    rows = load_rows(ocr_lines)\n    candidates = material_candidates(rows)\n\
          \    for item in candidates:\n        item['recognizedAlias'], item['aliasWarning']\
          \ = classify(item['text'])\n    clues = [{'lineIndex':r.get('i'),'text':str(r.get('text','')).strip()[:160]}\n\
          \             for r in rows if STRUCTURE_CLUE.search(str(r.get('text','')))]\n\
          \    return {\n        'material_context':json.dumps({'candidates':candidates,\n\
          \            'rule':'recognizedAlias 仅是文字匹配提示，不是分类结论；必须核对整张图纸。'},ensure_ascii=False,separators=(',',':')),\n\
          \        'structure_context':json.dumps({'categories':STRUCTURE_ENUM,\n\
          \            'ocrClues':clues[:16],\n            'rule':'仅是文字佐证；二级分类必须由原图的板片、折线、模切线及连接关系决定。'},ensure_ascii=False,separators=(',',':'))\n\
          \    }\n"
        code_language: python3
        desc: 保留材质原文与行号；枚举匹配仅作为提示，不代替模型核验
        outputs:
          material_context:
            children: null
            type: string
          structure_context:
            children: null
            type: string
