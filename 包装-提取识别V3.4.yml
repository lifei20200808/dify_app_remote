    - data:
        code: "import json\nimport re\n\nGROUPS = [\n    ('file_naming','图纸命名'),('document_info','图纸基本信息'),('dimensions','尺寸与公差'),('drawing_dimensions','制图区尺寸'),\n\
          \    ('material_properties','材料与物性'),('structure','结构与成型'),\n    ('process_printing','工艺与印刷'),('marks_certification','标识与认证'),\n\
          \    ('notes','备注与要求'),('other','其他识别元素')\n]\n\ndef load(value, fallback):\n\
          \    if isinstance(value, (dict, list)):\n        return value\n    text\
          \ = str(value or '').strip()\n    text = re.sub(r'^```(?:json)?\\s*|\\s*```$',\
          \ '', text, flags=re.I)\n    try:\n        return json.loads(text)\n   \
          \ except Exception:\n        return fallback\n\ndef rect(box, width, height):\n\
          \    if not isinstance(box, list) or len(box) != 4:\n        return None\n\
          \    x1,y1,x2,y2 = [float(v) for v in box]\n    return {'type':'rect','x':round(x1/width,6),'y':round(y1/height,6),\n\
          \            'width':round(max(0,x2-x1)/width,6),'height':round(max(0,y2-y1)/height,6)}\n\
          \n\nSCALE_VALUE_PATTERN = re.compile(r'(?<![0-9.])(?:\\d+(?:\\.\\d+)?\\\
          s*%|\\d+\\s*:\\s*\\d+)(?![0-9.])')\n\ndef find_labeled_scale(rows, width,\
          \ height):\n    labels = [row for row in rows if re.search(r'(?i)\\bSCALE\\\
          b|比例', str(row.get('text','')))]\n    candidates = []\n    for row in rows:\n\
          \        match = SCALE_VALUE_PATTERN.search(str(row.get('text','')))\n \
          \       if match:\n            candidates.append((row, re.sub(r'\\s+', '',\
          \ match.group(0))))\n    for label in labels:\n        same = SCALE_VALUE_PATTERN.search(str(label.get('text','')))\n\
          \        if same:\n            return re.sub(r'\\s+', '', same.group(0)),\
          \ [label.get('i')]\n    best = None\n    for label in labels:\n        lb\
          \ = label.get('box')\n        if not isinstance(lb, list) or len(lb) !=\
          \ 4:\n            continue\n        lcx, lcy = (float(lb[0])+float(lb[2]))/2,\
          \ (float(lb[1])+float(lb[3]))/2\n        lh = max(1.0, float(lb[3])-float(lb[1]))\n\
          \        for row, value in candidates:\n            rb = row.get('box')\n\
          \            if not isinstance(rb, list) or len(rb) != 4 or row.get('i')\
          \ == label.get('i'):\n                continue\n            rcx, rcy = (float(rb[0])+float(rb[2]))/2,\
          \ (float(rb[1])+float(rb[3]))/2\n            rh = max(1.0, float(rb[3])-float(rb[1]))\n\
          \            if abs(rcy-lcy) > max(height*0.035, 2.5*max(lh,rh)):\n    \
          \            continue\n            if rcx < float(lb[0])-width*0.02 or rcx-lcx\
          \ > width*0.4:\n                continue\n            score = abs(rcy-lcy)/height\
          \ + abs(rcx-lcx)/width\n            if best is None or score < best[0]:\n\
          \                best = (score, value, [label.get('i'), row.get('i')])\n\
          \    return (best[1], list(dict.fromkeys(i for i in best[2] if i is not\
          \ None))) if best else (None, [])\n\n\ndef filename_fields(name):\n    \"\
          \"\"Parse only explicit tokens; absence or ambiguity remains unfilled.\"\
          \"\"\n    text = str(name or '').strip()\n    if not text:\n        return\
          \ {}\n    stem = re.sub(r'\\.(?:pdf|png|jpe?g)$', '', text, flags=re.I)\n\
          \    result = {'file_naming.fullName': text}\n    match = re.search(r'(?<![A-Za-z0-9])[A-Za-z]{1,4}[A-Za-z0-9]{7,15}(?![A-Za-z0-9])',\
          \ stem)\n    if match:\n        result['file_naming.partNumber'] = match.group(0)\n\
          \    match = re.search(r'(?<!\\d)(?:19|20)\\d{6}(?!\\d)', stem)\n    if\
          \ match:\n        result['file_naming.date'] = match.group(0)\n    match\
          \ = re.search(r'(?<![A-Za-z0-9])V\\d{2}(?![A-Za-z0-9])', stem, re.I)\n \
          \   if match:\n        result['file_naming.revision'] = match.group(0)\n\
          \    return result\n\n\ndef labeled_dimensions(value):\n    \"\"\"Parse\
          \ drawing size values after a dimension field has been identified.\"\"\"\
          \n    text = str(value or '').upper().replace('×', 'X').replace('Ｘ', 'X').replace('＊',\
          \ '*')\n    # X or * between a number and the next axis is a separator,\
          \ not a word prefix.\n    text = re.sub(r'(?<=\\d)\\s*[X*]\\s*(?=[LWH]\\\
          s*[:=]?\\s*\\d)', ' ', text)\n    found = {}\n    for axis in 'LWH':\n \
          \       match = re.search(r'(?<![A-Z])' + axis + r'\\s*[:=]?\\s*(\\d+(?:\\\
          .\\d+)?)(?!\\d)', text)\n        if match:\n            found[axis] = match.group(1)\n\
